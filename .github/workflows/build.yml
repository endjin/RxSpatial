name: build
on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      forcePublish:
        description: When true the Publish stage will always be run, otherwise it only runs for tagged versions. (Publishing is currently disabled in .zf/config.ps1.)
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write  # enable cache clean-up
  checks: write  # enable test result annotations
  contents: write  # enable creating releases
  issues: read
  packages: write  # enable publishing packages
  pull-requests: write  # enable test result annotations

jobs:
  # The standard ZeroFailed build (./build.ps1) over the whole solution: compile, test with coverage,
  # Covenant SBOM, package. Windows is the only OS that builds every project: the WPF demo targets
  # net10.0-windows. The archived SQL Server projects (solutions/archive) are not in the solution.
  build:
    name: Build (Windows, full solution)
    runs-on: windows-latest
    outputs:
      semver: ${{ steps.run_build.outputs.semver }}
      major: ${{ steps.run_build.outputs.major }}
      majorMinor: ${{ steps.run_build.outputs.majorMinor }}
      preReleaseTag: ${{ steps.run_build.outputs.preReleaseTag }}
    steps:
    - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/prepare-env-vars-and-secrets@main
      id: prepareEnvVarsAndSecrets
      with:
        environmentVariablesYaml: |
          {}
        secretsYaml: |
          {}
        secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}

    - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/run-build-process@main
      id: run_build
      with:
        netSdkVersion: '10.0.x'
        forcePublish: ${{ github.event.inputs.forcePublish == 'true' }}
        runsOn: windows-latest  # only labels the code coverage PR comment
        buildEnv: ${{ steps.prepareEnvVarsAndSecrets.outputs.environmentVariablesYamlBase64 }}
        buildSecrets: ${{ steps.prepareEnvVarsAndSecrets.outputs.secretsYamlBase64 }}
        secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}
        token: ${{ secrets.GITHUB_TOKEN }}

  # The same ZeroFailed build on Linux and macOS, pointed at solutions/RxSpatial.CrossPlatform.slnf (every project
  # except the Windows-only ones) and limited to Build,Test: the SBOM and packaging come from the Windows
  # job. Test includes the examples smoke test (.zf/config.ps1, PostTest).
  cross-platform:
    name: Build (${{ matrix.os }}, cross-platform projects)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/prepare-env-vars-and-secrets@main
      id: prepareEnvVarsAndSecrets
      with:
        # ZF_BUILD_DOTNET_SOLUTION_TO_BUILD is read by .zf/config.ps1. The Markdown coverage summary is
        # turned off so that only the Windows job posts the coverage PR comment.
        environmentVariablesYaml: |
          ZF_BUILD_DOTNET_SOLUTION_TO_BUILD: solutions/RxSpatial.CrossPlatform.slnf
          ZF_BUILD_DOTNET_GENERATE_MARKDOWN_COVERAGE_REPORT: 'false'
        secretsYaml: |
          {}
        secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}

    - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/run-build-process@main
      id: run_build
      with:
        netSdkVersion: '10.0.x'
        buildTasks: 'Build,Test'
        runsOn: ${{ matrix.os }}  # only labels the code coverage PR comment
        buildEnv: ${{ steps.prepareEnvVarsAndSecrets.outputs.environmentVariablesYamlBase64 }}
        buildSecrets: ${{ steps.prepareEnvVarsAndSecrets.outputs.secretsYamlBase64 }}
        secretsEncryptionKey: ${{ secrets.SHARED_WORKFLOW_KEY }}
        token: ${{ secrets.GITHUB_TOKEN }}
