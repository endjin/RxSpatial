<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RxSpatial MapLibre view</title>
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    /* Overlays follow the WPF panel's Fluent (Windows 11) light theme: Segoe UI Variable,
       8px corners, a light acrylic-like translucent white with a hairline stroke and a soft
       two-layer shadow. */
    :root {
      --font: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      --surface: rgba(252, 252, 252, .86);
      --surface-hover: rgba(240, 240, 240, .92);
      --stroke: rgba(0, 0, 0, .08);
      --shadow: 0 8px 16px rgba(0, 0, 0, .14), 0 0 2px rgba(0, 0, 0, .12);
      --shadow-low: 0 2px 4px rgba(0, 0, 0, .14), 0 0 2px rgba(0, 0, 0, .12);
      --text: rgba(0, 0, 0, .9);
    }
    html, body, #map { margin: 0; padding: 0; height: 100%; }
    body, .maplibregl-map { font-family: var(--font); }
    /* A vehicle marker. Its body is the ::before box, not the element: MapLibre positions the
       element with its own transform, so only the body may rotate (the alert diamond). Every
       state has its own shape, so state never relies on colour alone (WCAG 1.4.1): blue
       circle, gray dashed ring, green rounded square, yellow triangle, red diamond. The
       element stays 30px square (the hit area) with its centre on the vehicle. */
    .vehicle-marker {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; cursor: default; /* 26px body + 2px ring each side */
      z-index: 1; /* above the area labels */
      --fill: #1565C0; --border: #ffffff; --text: #ffffff;
    }
    .vehicle-marker::before {
      content: ''; position: absolute; inset: 0; box-sizing: border-box;
      background: var(--fill); border: 2px solid var(--border); border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 3px 8px rgba(0,0,0,.22);
    }
    .vehicle-marker.dashed::before { border-style: dashed; }
    .vehicle-marker.square::before { border-radius: 6px; transform: scale(.9); }
    .vehicle-marker.diamond::before { border-radius: 3px; transform: rotate(45deg) scale(.8); }
    /* The warning triangle: a CSS border cannot follow a clip-path, so ::before is the
       border-coloured triangle and ::after the fill, inset 2px from each edge. Both are
       38 x 33px, wider than the element, and placed so the centroid sits on the element's
       centre; they ignore the pointer, so the hit area stays the element's. A box-shadow
       would be clipped away, so the element carries the shadow as a drop-shadow filter. */
    .vehicle-marker.triangle {
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)) drop-shadow(0 2px 4px rgba(0,0,0,.22));
    }
    .vehicle-marker.triangle::before,
    .vehicle-marker.triangle::after {
      clip-path: polygon(50% 0, 100% 100%, 0 100%); pointer-events: none;
      border: 0; border-radius: 0; box-shadow: none;
    }
    .vehicle-marker.triangle::before { inset: -7px -4px 4px; background: var(--border); }
    .vehicle-marker.triangle::after {
      content: ''; position: absolute; inset: -3px -.5px 6px; background: var(--fill);
    }
    .vehicle-marker span {
      position: relative; z-index: 1; color: var(--text); font: 600 11px var(--font);
    }
    /* Centred on the triangle's centroid (the element's centre), where its visual middle is
       and it is still ~21px wide inside the border; a size smaller so two digits fit, and
       line-height 1 so the digits, not the font's taller default line box, are centred. */
    .vehicle-marker.triangle span { font-size: 10px; line-height: 1; }
    .area-label {
      background: var(--surface); color: var(--text);
      -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
      border: 1px solid var(--stroke);
      font: 600 12px/1 var(--font);
      padding: 4px 8px 5px; border-radius: 8px;
      box-shadow: var(--shadow-low);
      pointer-events: none; white-space: nowrap;
    }
    /* A lens's area: smaller than an area label, with the lens's teal as its stroke. */
    .area-label.lens-label {
      font-size: 11px; padding: 3px 6px 4px; border-color: #00695C;
    }
    #draw-hint {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 2; display: none;
      background: var(--surface); color: var(--text);
      -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--stroke);
      font: 14px/20px var(--font);
      padding: 8px 16px; border-radius: 8px;
      box-shadow: var(--shadow);
      pointer-events: none; white-space: nowrap;
    }
    /* MapLibre's zoom/compass group and the attribution, as Fluent flyout-style surfaces. */
    .maplibregl-ctrl-bottom-right .maplibregl-ctrl { margin: 0 16px 16px 0; }
    .maplibregl-ctrl-group:not(:empty) {
      background: var(--surface);
      -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--stroke); border-radius: 8px;
      box-shadow: var(--shadow-low); overflow: hidden;
    }
    .maplibregl-ctrl-group button { width: 32px; height: 32px; }
    .maplibregl-ctrl-group button + button { border-top: 1px solid var(--stroke); }
    .maplibregl-ctrl button:not(:disabled):hover { background-color: var(--surface-hover); }
    .maplibregl-ctrl-attrib.maplibregl-compact,
    .maplibregl-ctrl.maplibregl-ctrl-attrib {
      background: var(--surface);
      -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--stroke); border-radius: 8px;
      box-shadow: var(--shadow-low);
      font: 12px/20px var(--font); color: var(--text);
    }
    .maplibregl-ctrl-attrib a { color: rgba(0, 0, 0, .62); }
    /* Keyboard focus on the map (arrows pan, +/- zoom): a clear inset ring, not Chrome's
       hairline (WCAG 2.4.7). */
    .maplibregl-canvas:focus-visible { outline: 2px solid rgba(0, 0, 0, .8); outline-offset: -2px; }
    /* Draw mode: a crosshair over the whole map, vehicle markers included. */
    body.drawing .maplibregl-canvas-container,
    body.drawing .maplibregl-canvas,
    body.drawing .vehicle-marker { cursor: crosshair !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="draw-hint"></div>
  <script>
    // MapLibre zoom levels use the 512px-tile convention; 9 matches the original
    // Bing Maps ZoomLevel of 10 (256px-tile convention).
    const DEFAULT_VIEW = { center: [-122.2016143798835, 47.5319677333823], zoom: 9 };
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: DEFAULT_VIEW.center,
      zoom: DEFAULT_VIEW.zoom
    });
    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

    const post = (m) => window.chrome.webview.postMessage(m);
    const markers = new Map();    // id -> maplibregl.Marker
    const areaLabels = new Map(); // area id -> maplibregl.Marker (its corner label)

    // Area styles. None may resemble the OSM palette (pink/orange/yellow roads, green
    // parks, blue water, beige land) or a vehicle colour, and streets must stay legible
    // underneath: restricted is a slate hatch, confinement a purple dashed outline over an
    // almost clear fill, a zone (Overlap tab) a solid brown outline over an almost clear fill.
    // The drawing preview uses the same style, lighter and dashed.
    const AREA_STYLES = {
      restricted: {
        label: 'Restricted', noun: 'restricted area', color: '#37474F', pattern: 'hatch-restricted',
        fillOpacity: 0.35, previewFillOpacity: 0.2, lineWidth: 2, dash: null
      },
      confinement: {
        label: 'Confinement', noun: 'confinement area', color: '#6A1B9A', pattern: null,
        fillOpacity: 0.06, previewFillOpacity: 0.04, lineWidth: 2.5, dash: [3, 2]
      },
      zone: {
        label: 'Zone', noun: 'zone', color: '#6D4C41', pattern: null,
        fillOpacity: 0.06, previewFillOpacity: 0.04, lineWidth: 2.5, dash: null
      }
    };

    // Overlap tab overlays: query results drawn above the areas and below the lines. Each has a
    // pattern or outline of its own, not just a colour, and none uses a marker or OSM colour:
    // a vehicle's reach is a thin slate circle with no fill; a lens (two watched reaches
    // overlapping, RxRxIntersection) a teal dot pattern with a solid teal outline; the part of a
    // reach inside a zone (RxIntersection) the zone's brown as a back-diagonal hatch. A tint
    // under a pattern fills the gaps between its dots.
    const OVERLAY_STYLES = {
      zoneOverlap: { color: '#6D4C41', pattern: 'hatch-zone-overlap', fillOpacity: 0.6, lineWidth: 1, lineOpacity: 0.8 },
      reach: { color: '#455A64', pattern: null, fillOpacity: 0, lineWidth: 1.25, lineOpacity: 0.7 },
      lens: { color: '#00695C', pattern: 'dots-lens', fillOpacity: 0.9, tintOpacity: 0.12, lineWidth: 2, lineOpacity: 1 }
    };
    const PREVIEW_ID = 'draw-preview';
    const MIN_DRAG_PX = 6;

    // Areas sit below every line (convoy links): they are inserted before this empty layer,
    // lines are appended above it. Vehicle markers are DOM elements, so always on top.
    const AREA_TOP = 'areas-top';

    // A seamless diagonal hatch tile, drawn at 2x so the lines stay crisp on high-DPI screens:
    // bottom-left to top-right, or mirrored (top-left to bottom-right) when backward.
    function hatchImage(color, backward) {
      const ratio = 2, px = 10 * ratio;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = px;
      const ctx = canvas.getContext('2d');
      if (backward) { ctx.translate(px, 0); ctx.scale(-1, 1); }
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5 * ratio;
      ctx.beginPath();
      // The main diagonal plus the two corner pieces that join it to the neighbouring tiles.
      ctx.moveTo(0, px); ctx.lineTo(px, 0);
      ctx.moveTo(-px / 2, px / 2); ctx.lineTo(px / 2, -px / 2);
      ctx.moveTo(px / 2, px * 1.5); ctx.lineTo(px * 1.5, px / 2);
      ctx.stroke();
      return { image: ctx.getImageData(0, 0, px, px), pixelRatio: ratio };
    }

    // A dot grid tile (one dot per 4px cell), also drawn at 2x.
    function dotImage(color) {
      const ratio = 2, px = 4 * ratio;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = px;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(px / 2, px / 2, 0.9 * ratio, 0, 2 * Math.PI);
      ctx.fill();
      return { image: ctx.getImageData(0, 0, px, px), pixelRatio: ratio };
    }

    function addPattern(name, tile) {
      map.addImage(name, tile.image, { pixelRatio: tile.pixelRatio });
    }

    const emptyCollection = () => ({ type: 'FeatureCollection', features: [] });

    map.on('load', () => {
      addPattern(AREA_STYLES.restricted.pattern, hatchImage(AREA_STYLES.restricted.color, false));
      addPattern(OVERLAY_STYLES.zoneOverlap.pattern, hatchImage(OVERLAY_STYLES.zoneOverlap.color, true));
      addPattern(OVERLAY_STYLES.lens.pattern, dotImage(OVERLAY_STYLES.lens.color));
      map.addSource(AREA_TOP, { type: 'geojson', data: emptyCollection() });
      map.addLayer({ id: AREA_TOP, type: 'line', source: AREA_TOP });
      // One source per overlay kind, in drawing order, above every area (inserted before
      // AREA_TOP) and below every line (appended later).
      for (const [kind, style] of Object.entries(OVERLAY_STYLES)) {
        const sourceId = 'ov-' + kind;
        map.addSource(sourceId, { type: 'geojson', data: emptyCollection() });
        if (style.tintOpacity) {
          map.addLayer({
            id: sourceId + '-tint', type: 'fill', source: sourceId,
            paint: { 'fill-color': style.color, 'fill-opacity': style.tintOpacity }
          });
        }
        if (style.fillOpacity > 0) {
          const fillPaint = style.pattern ? { 'fill-pattern': style.pattern } : { 'fill-color': style.color };
          fillPaint['fill-opacity'] = style.fillOpacity;
          map.addLayer({ id: sourceId + '-fill', type: 'fill', source: sourceId, paint: fillPaint });
        }
        map.addLayer({
          id: sourceId + '-line', type: 'line', source: sourceId,
          paint: { 'line-color': style.color, 'line-width': style.lineWidth, 'line-opacity': style.lineOpacity }
        });
      }
      post({ type: 'ready' });
    });

    // ---- Overlays ----------------------------------------------------------------------
    // Each kind keeps its features by id; changes are flushed to the map once per animation
    // frame, so 20 vehicles moving 25 times a second cost one setData per kind per frame.
    const overlays = { zoneOverlap: new Map(), reach: new Map(), lens: new Map() };
    const overlayLabels = new Map(); // lens id -> maplibregl.Marker (its area pill)
    const dirtyOverlays = new Set();
    let flushPending = false;

    function setOverlayFeature(kind, id, geometry) {
      if (geometry) overlays[kind].set(id, { type: 'Feature', geometry, properties: {} });
      else if (!overlays[kind].delete(id)) return;
      dirtyOverlays.add(kind);
      if (!flushPending) { flushPending = true; requestAnimationFrame(flushOverlays); }
    }

    function flushOverlays() {
      flushPending = false;
      for (const kind of dirtyOverlays) {
        map.getSource('ov-' + kind)?.setData({ type: 'FeatureCollection', features: [...overlays[kind].values()] });
      }
      dirtyOverlays.clear();
    }

    // A lens's tips (the vertices farthest from its middle) are where the two reach circles
    // cross, a full reach from both vehicles, so a label there is clear of both markers. The
    // lower tip is used (the right one if the lens lies flat), and the pill points away from
    // the lens.
    function lensLabelPlacement(polygons) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      const points = polygons.flatMap(p => p[0]);
      for (const [x, y] of points) {
        minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, k = Math.cos(cy * Math.PI / 180);
      let tip = points[0], best = -Infinity;
      for (const p of points) {
        const dx = (p[0] - cx) * k, dy = p[1] - cy;
        // Distance from the middle, nudged towards the lower right so one tip wins steadily.
        const score = Math.hypot(dx, dy) * (1 + 0.05 * Math.sign(dx - dy));
        if (score > best) { best = score; tip = p; }
      }
      const dx = (tip[0] - cx) * k, dy = tip[1] - cy;
      const anchor = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'left' : 'right') : (dy > 0 ? 'bottom' : 'top');
      return { lngLat: tip, anchor };
    }

    // An outline from C# (OutlineWriter.WriteRing): integer micro-degrees, the first vertex
    // absolute and each later one as the step from the one before, [lon0, lat0, dLon1, dLat1, ...].
    // Returns the closed GeoJSON ring of [longitude, latitude] pairs.
    function decodeRing(steps) {
      const ring = [];
      let lon = 0, lat = 0;
      for (let i = 0; i < steps.length; i += 2) {
        lon += steps[i]; lat += steps[i + 1];
        ring.push([lon / 1e6, lat / 1e6]);
      }
      ring.push(ring[0]);
      return ring;
    }

    // A region is one convex ring (OverlapShapes in C#), drawn as a MultiPolygon of one polygon.
    function setOverlay(m) {
      const polygons = [[decodeRing(m.ring)]];
      setOverlayFeature(m.kind, m.id, { type: 'MultiPolygon', coordinates: polygons });
      if (!m.label) { removeOverlayLabel(m.id); return; }
      const placement = lensLabelPlacement(polygons);
      let label = overlayLabels.get(m.id);
      if (!label || label.getElement().dataset.anchor !== placement.anchor) {
        removeOverlayLabel(m.id);
        const el = document.createElement('div');
        el.className = 'area-label lens-label';
        el.dataset.anchor = placement.anchor;
        label = new maplibregl.Marker({ element: el, anchor: placement.anchor, offset: labelOffset(placement.anchor) });
        label.setLngLat(placement.lngLat).addTo(map);
        overlayLabels.set(m.id, label);
      } else {
        label.setLngLat(placement.lngLat);
      }
      // Rewriting unchanged text would still restyle the pill.
      const el = label.getElement();
      if (el.textContent !== m.label) el.textContent = m.label;
    }

    function labelOffset(anchor) {
      return { left: [4, 0], right: [-4, 0], top: [0, 4], bottom: [0, -4] }[anchor];
    }

    function removeOverlayLabel(id) {
      const label = overlayLabels.get(id);
      if (label) { label.remove(); overlayLabels.delete(id); }
    }

    function removeOverlay(m) {
      setOverlayFeature(m.kind, m.id, null);
      removeOverlayLabel(m.id);
    }

    // ---- Area drawing mode -------------------------------------------------------------
    // C# turns it on (beginDraw) and may cancel it (cancelDraw); the drag and its live
    // preview run entirely here. A finished rectangle goes back as 'areaDrawn'; a cancel made
    // in the map (Esc, right-click) goes back as 'drawCancelled' so the panel can un-press
    // its button. The gestures that use a left drag or a click are suspended while the mode
    // is on; scroll zoom and the +/- buttons keep working.
    const canvasContainer = map.getCanvasContainer();
    const hint = document.getElementById('draw-hint');
    const suspendedGestures = [map.dragPan, map.dragRotate, map.boxZoom, map.doubleClickZoom];
    let drawKind = null; // an AREA_STYLES key while the mode is on
    let drag = null;     // the press point ({ x, y, lngLat }) while a drag is in progress

    function beginDraw(kind) {
      if (!AREA_STYLES[kind]) return;
      clearPreview();
      drag = null;
      drawKind = kind;
      for (const gesture of suspendedGestures) gesture.disable();
      document.body.classList.add('drawing');
      hint.textContent = 'Drag to draw a ' + AREA_STYLES[kind].noun + ' · Esc to cancel';
      hint.style.display = 'block';
    }

    function endDraw() {
      clearPreview();
      drag = null;
      drawKind = null;
      for (const gesture of suspendedGestures) gesture.enable();
      document.body.classList.remove('drawing');
      hint.style.display = 'none';
    }

    function cancelDrawFromMap() {
      if (!drawKind) return;
      endDraw();
      post({ type: 'drawCancelled' });
    }

    // The pointer position relative to the map, clamped to it: releasing outside the map
    // still finishes the rectangle at the map's edge. Measured against the map container:
    // the canvas container has no height of its own (the canvas inside it is positioned).
    function mapPoint(e) {
      const rect = map.getContainer().getBoundingClientRect();
      const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
      const y = Math.min(Math.max(e.clientY - rect.top, 0), rect.height);
      return { x, y, lngLat: map.unproject([x, y]) };
    }

    function bounds(a, b) {
      return {
        south: Math.min(a.lat, b.lat), north: Math.max(a.lat, b.lat),
        west: Math.min(a.lng, b.lng), east: Math.max(a.lng, b.lng)
      };
    }

    function ringOf(b) {
      return [[b.west, b.south], [b.east, b.south], [b.east, b.north], [b.west, b.north], [b.west, b.south]];
    }

    // Capture phase, so a press on a vehicle marker starts a rectangle too.
    canvasContainer.addEventListener('mousedown', (e) => {
      if (!drawKind || e.button !== 0) return;
      e.preventDefault();
      drag = mapPoint(e);
    }, true);

    window.addEventListener('mousemove', (e) => {
      if (!drawKind || !drag) return;
      drawArea(PREVIEW_ID, drawKind, bounds(drag.lngLat, mapPoint(e).lngLat), true);
    });

    window.addEventListener('mouseup', (e) => {
      if (!drawKind || !drag || e.button !== 0) return;
      const start = drag;
      const end = mapPoint(e);
      drag = null;
      clearPreview();
      // No real drag (either side under MIN_DRAG_PX): ignore it and stay in the mode.
      if (Math.abs(end.x - start.x) < MIN_DRAG_PX || Math.abs(end.y - start.y) < MIN_DRAG_PX) return;
      const kind = drawKind;
      endDraw();
      post({ type: 'areaDrawn', kind, ...bounds(start.lngLat, end.lngLat) });
    });

    canvasContainer.addEventListener('contextmenu', (e) => {
      if (!drawKind) return;
      e.preventDefault();
      cancelDrawFromMap();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') cancelDrawFromMap();
    });

    // ---- View ------------------------------------------------------------------------------
    // The Overlap tab zooms to the replayed trajectories, so the reach circles and lenses are
    // larger than the markers; leaving it restores the default view. Without animation when
    // the user prefers reduced motion.
    const viewDuration = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600;

    function fitView(m) {
      map.fitBounds([[m.west, m.south], [m.east, m.north]], { padding: 48, bearing: 0, duration: viewDuration() });
    }

    // A marker update carries only what changed (MarkerCommand in C#): the label once, when
    // the marker is created; lat/lon and reach when it moves; the style fields when the state
    // changes. Every DOM write restyles the marker, so nothing unchanged is rewritten.
    function setMarker(m) {
      let marker = markers.get(m.id);
      if (!marker) {
        if (m.lat === undefined) return;
        const el = document.createElement('div');
        el.className = 'vehicle-marker';
        const label = document.createElement('span');
        el.appendChild(label);
        marker = new maplibregl.Marker({ element: el, anchor: 'center' });
        marker.setLngLat([m.lon, m.lat]).addTo(map);
        markers.set(m.id, marker);
      } else if (m.lat !== undefined) {
        marker.setLngLat([m.lon, m.lat]);
      }
      if (m.label !== undefined) marker.getElement().querySelector('span').textContent = m.label;
      if (m.fill !== undefined) applyMarkerStyle(marker, m);
      // The reach ring comes from C# (GeoOperations.ToVertices of the pushed GeoCircle); null removes it.
      if (m.reach !== undefined) {
        setOverlayFeature('reach', m.id, m.reach ? { type: 'Polygon', coordinates: [decodeRing(m.reach)] } : null);
      }
    }

    // Fill, border and label colours travel together (a light fill needs a dark label), and
    // with them the shape (VehicleColors in C#), one per state.
    const MARKER_SHAPES = ['circle', 'dashed', 'square', 'triangle', 'diamond'];
    function applyMarkerStyle(marker, m) {
      const el = marker.getElement();
      el.style.setProperty('--fill', m.fill);
      el.style.setProperty('--border', m.border);
      el.style.setProperty('--text', m.text);
      for (const shape of MARKER_SHAPES) el.classList.toggle(shape, shape === m.shape);
    }

    function removeMarker(m) {
      const marker = markers.get(m.id);
      if (marker) { marker.remove(); markers.delete(m.id); }
      setOverlayFeature('reach', m.id, null);
    }

    function upsertSource(id, geometry) {
      const sourceId = 's-' + id;
      const source = map.getSource(sourceId);
      const data = { type: 'Feature', geometry };
      if (source) { source.setData(data); return false; }
      map.addSource(sourceId, { type: 'geojson', data });
      return true;
    }

    function setLine(m) {
      const added = upsertSource(m.id, { type: 'LineString', coordinates: m.points });
      const layerId = 'l-' + m.id;
      if (added) {
        map.addLayer({
          id: layerId, type: 'line', source: 's-' + m.id,
          paint: { 'line-color': m.color, 'line-width': m.width, 'line-opacity': m.opacity }
        });
      } else {
        map.setPaintProperty(layerId, 'line-color', m.color);
        map.setPaintProperty(layerId, 'line-width', m.width);
        map.setPaintProperty(layerId, 'line-opacity', m.opacity);
      }
      map.setPaintProperty(layerId, 'line-dasharray', m.dashed ? [2, 3] : [1, 0]);
    }

    // Draws (or redraws) an area rectangle: a fill, an outline and, for a finished area, a
    // label pill in its top-left corner. The style has no glyphs URL, so the label is an
    // HTML marker rather than a symbol layer.
    function drawArea(id, kind, b, preview) {
      const style = AREA_STYLES[kind];
      const fillId = 'f-' + id, lineId = 'l-' + id;
      if (upsertSource(id, { type: 'Polygon', coordinates: [ringOf(b)] })) {
        const before = preview ? undefined : AREA_TOP;
        const fillPaint = style.pattern ? { 'fill-pattern': style.pattern } : { 'fill-color': style.color };
        map.addLayer({ id: fillId, type: 'fill', source: 's-' + id, paint: fillPaint }, before);
        map.addLayer({
          id: lineId, type: 'line', source: 's-' + id,
          paint: { 'line-color': style.color, 'line-width': style.lineWidth }
        }, before);
        map.setPaintProperty(fillId, 'fill-opacity', preview ? style.previewFillOpacity : style.fillOpacity);
        map.setPaintProperty(lineId, 'line-opacity', preview ? 0.85 : 1);
        // A preview is always dashed; a finished area only when its kind is.
        const dash = preview ? (style.dash || [2, 1.5]) : style.dash;
        if (dash) map.setPaintProperty(lineId, 'line-dasharray', dash);
      }

      if (!preview) {
        const el = document.createElement('div');
        el.className = 'area-label';
        el.textContent = style.label;
        areaLabels.get(id)?.remove();
        areaLabels.set(id, new maplibregl.Marker({ element: el, anchor: 'top-left', offset: [5, 5] })
          .setLngLat([b.west, b.north]).addTo(map));
      }
    }

    function clearPreview() {
      removeShape({ id: PREVIEW_ID });
    }

    function removeShape(m) {
      for (const layerId of ['f-' + m.id, 'l-' + m.id]) {
        if (map.getLayer(layerId)) map.removeLayer(layerId);
      }
      if (map.getSource('s-' + m.id)) map.removeSource('s-' + m.id);
      const label = areaLabels.get(m.id);
      if (label) { label.remove(); areaLabels.delete(m.id); }
    }

    // C# posts one message per dispatcher operation (a traffic tick, a click): an array of
    // commands, applied in order (MapLibreMap batches them).
    window.chrome.webview.addEventListener('message', (ev) => {
      for (const m of ev.data) handleCommand(m);
    });

    function handleCommand(m) {
      switch (m.cmd) {
        case 'setMarker': setMarker(m); break;
        case 'removeMarker': removeMarker(m); break;
        case 'setLine': setLine(m); break;
        case 'setArea': drawArea(m.id, m.kind, m, false); break;
        case 'removeShape': removeShape(m); break;
        case 'setOverlay': setOverlay(m); break;
        case 'removeOverlay': removeOverlay(m); break;
        case 'beginDraw': beginDraw(m.kind); break;
        case 'cancelDraw': endDraw(); break;
        case 'fitBounds': fitView(m); break;
        case 'resetView': map.easeTo({ ...DEFAULT_VIEW, bearing: 0, pitch: 0, duration: viewDuration() }); break;
      }
    }
  </script>
</body>
</html>
